name: store

# Rebuilds the store's generated files (manifests.json, sphaira.json) from ports.json, the ports' own portzone.json
# files and the drafts: on store changes, and once a day so porters' edits reach PortZone and Sphaira without a pull
# request. Pull requests only check.
on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths: ["store/**"]
  pull_request:
    paths: ["store/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Check
        if: github.event_name == 'pull_request'
        run: python store/scripts/build_store.py --check
      - name: Build
        if: github.event_name != 'pull_request'
        run: python store/scripts/build_store.py
      - name: Commit generated files
        if: github.event_name != 'pull_request'
        run: |
          git add store/manifests.json store/sphaira.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the store's generated files"
          git push
